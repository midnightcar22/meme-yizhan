# 每次 push / PR 自动跑：安装依赖 → 内容校验 → 全量构建，任一失败即红叉
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: 校验 + 构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Build site
        run: npm run build

      - name: Check workflows syntax
        run: npm run check:workflows

<!DOCTYPE html>
<!--
  文件名：src/meme-page.template.html
  项目：MEME·译站 / MemeBridge
  说明：梗详情页壳模板（勿手改）。scripts/build-memes.mjs 逐梗替换占位符后
        输出到 memes/<id>.html。占位符：TITLE / DESC / URL / IMAGE / JSONLD / BODY / ID
-->
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0F0F0F" />
  <meta name="color-scheme" content="dark light" />
  <meta name="robots" content="index,follow" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESC}}" />

  <!-- Open Graph / Twitter（社交卡片，抓取时只读原始 HTML） -->
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="MEME·译站" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{DESC}}" />
  <meta property="og:url" content="{{URL}}" />
  <meta property="og:image" content="{{IMAGE}}" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{DESC}}" />
  <meta name="twitter:image" content="{{IMAGE}}" />
  <link rel="canonical" href="{{URL}}" />

  <!-- 结构化数据（搜索富摘要） -->
  <script type="application/ld+json">{{JSONLD}}</script>

  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../css/tailwind.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>

<body class="text-txt min-h-screen">
  <!-- 语言切换（app.js toggleLang 即时重渲染） -->
  <button id="lang-toggle" class="fixed top-3 right-3 z-50 pill px-3 py-1.5 text-xs font-bold bg-surface/90 backdrop-blur border border-primary/60 text-primary"
          aria-label="Switch language" onclick="toggleLang()">中文</button>

  <main class="max-w-md mx-auto px-4 pt-4 pb-24 min-h-screen">
    <!-- 静态内容由构建脚本预渲染（爬虫可读全文）；
         app.js 加载后用 localStorage 用户状态水合此容器 -->
    <div data-static-wiki="{{ID}}">
{{BODY}}
    </div>
  </main>

  <!-- 底部固定 Tab Bar（返回应用各页） -->
  <nav class="tabbar fixed bottom-0 left-0 right-0 bg-surface/95 backdrop-blur border-t border-white/10 z-50" aria-label="Main navigation" data-i18n-aria="nav.aria">
    <div class="max-w-md mx-auto grid grid-cols-5 text-xs">
      <a href="../index.html#/home"      class="tab-item flex flex-col items-center py-2 gap-1" aria-label="Home" data-i18n-aria="nav.home"><span>🏠</span><span data-i18n="nav.home">Home</span></a>
      <a href="../index.html#/discover"  class="tab-item flex flex-col items-center py-2 gap-1" aria-label="Discover" data-i18n-aria="nav.discover"><span>🧭</span><span data-i18n="nav.discover">Discover</span></a>
      <a href="../index.html#/create"    class="tab-item flex flex-col items-center py-2 gap-1" aria-label="Create" data-i18n-aria="nav.create"><span>🎨</span><span data-i18n="nav.create">Create</span></a>
      <a href="../index.html#/challenge" class="tab-item flex flex-col items-center py-2 gap-1" aria-label="Challenges" data-i18n-aria="nav.challenge"><span>🏆</span><span data-i18n="nav.challenge">Challenges</span></a>
      <a href="../index.html#/profile"   class="tab-item flex flex-col items-center py-2 gap-1" aria-label="Me" data-i18n-aria="nav.profile"><span>👤</span><span data-i18n="nav.profile">Me</span></a>
    </div>
  </nav>

  <script src="../js/data.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/wiki-template.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
